name: crash-repro (temporário)
on:
  push:
    branches: [ci/crash-repro]
permissions:
  contents: read
  actions: read
jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Baixar APK 2.17.79
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh run download 45091456875 -n ELVANOQ-signed-release -D apk --repo ${{ github.repository }}
          ls -la apk
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash ci/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: repro-logs, path: out/ }
