name: ELVANOQ Cloud CI
on:
  pull_request:
    paths:
      - "services/license-api/**"
      - ".github/workflows/elvanoq-cloud-ci.yml"
  push:
    branches: [feature/elvanoq-cloud-foundation]
    paths:
      - "services/license-api/**"
      - ".github/workflows/elvanoq-cloud-ci.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/license-api
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/elvanoq?schema=public
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/license-api/package-lock.json
      - name: Install
        run: npm ci
      - name: Validate schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Compile
        run: npm run build
      - name: Unit tests
        run: npm test
