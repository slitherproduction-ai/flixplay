name: ELVANOQ Cloud Portal CI
on:
  push:
    branches: [feature/elvanoq-cloud-foundation]
    paths:
      - "apps/cloud-portal/**"
      - ".github/workflows/elvanoq-cloud-portal-ci.yml"
  pull_request:
    paths:
      - "apps/cloud-portal/**"
      - ".github/workflows/elvanoq-cloud-portal-ci.yml"
jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install portal dependencies
        run: npm install --no-audit --no-fund
        working-directory: apps/cloud-portal
      - name: Compile and bundle portal
        run: npm run build
        working-directory: apps/cloud-portal
