// Offline bootstrap for the React Native settings plugin.
// The persistent cache contains org.gradle.toolchains:foojay-resolver:1.0.0,
// but Gradle's marker lookup is incomplete. Resolve that one plugin directly
// to the cached implementation module; all other dependencies remain offline.
beforeSettings { settings ->
  def localMaven = System.getenv("ELVANOQ_OFFLINE_MAVEN")
  settings.pluginManagement {
    repositories {
      if (localMaven) {
        maven { url = uri(localMaven) }
      }
      google()
      mavenCentral()
    }
    resolutionStrategy {
      eachPlugin {
        if (requested.id.id == "org.gradle.toolchains.foojay-resolver-convention") {
          useModule("org.gradle.toolchains:foojay-resolver:1.0.0")
        }
        if (requested.id.id == "com.diffplug.spotless") {
            useModule("com.diffplug.spotless:spotless-plugin-gradle:8.1.0")
        }
        if (requested.id.id == "com.ncorti.ktfmt.gradle") {
            useModule("com.ncorti.ktfmt.gradle:plugin:0.22.0")
        }
        if (requested.id.id == "org.jetbrains.kotlin.jvm") {
            useModule("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20")
        }
      }
    }
  }
}
